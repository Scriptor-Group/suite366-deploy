name: Channel signature

# An appliance holding our public key REFUSES a channel manifest that is not
# signed by it, and refuses an update.sh or backup.sh whose hash does not match
# the `updater_sha256` / `backup_sha256` inside that signed manifest. All are
# fail-closed, which is the
# right behaviour — and it means a forgotten `tools/sign-channel.sh` does not break
# the fleet, it STOPS it: every box quietly keeps its current version and nobody
# notices for weeks.
#
# So the two things that must never diverge are checked here, on every change:
#   1. channel.json.sig actually verifies against channel.json
#   2. channel.json's updater_sha256 matches the update.sh in this tree
#   3. channel.json's backup_sha256  matches the backup.sh in this tree
#
# (3) is the one that bites quietly: update.sh refreshes itself on every apply,
# so a stale backup_sha256 leaves a fleet running new updaters and old backup
# agents, with the nightly job still reporting success.
#
# Needs only the PUBLIC key, so it lives in a repo variable rather than a secret:
#   Settings > Secrets and variables > Actions > Variables > PACKAGE_PUBLIC_KEY_PEM
on:
  push:
    paths: ['channel.json', 'channel.json.sig', 'update.sh', 'backup.sh']
  pull_request:
    paths: ['channel.json', 'channel.json.sig', 'update.sh', 'backup.sh']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pinned script hashes match this tree
        run: |
          set -euo pipefail
          rc=0
          check() {   # check FIELD FILE
            local field="$1" file="$2" want got
            bash -n "$file"
            want="$(sed -n "s/.*\"$field\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p" channel.json | head -1)"
            got="$(sha256sum "$file" | awk '{print $1}')"
            if [[ -z "$want" ]]; then
              echo "::error::channel.json has an empty $field — run tools/sign-channel.sh"
              rc=1; return
            fi
            if [[ "$want" != "$got" ]]; then
              echo "::error::$field is stale. channel.json pins $want but $file hashes to $got."
              echo "::error::Run: PACKAGE_PRIVATE_KEY=… tools/sign-channel.sh   and commit both files."
              rc=1; return
            fi
            echo "$field matches ($got)"
          }
          check updater_sha256 update.sh
          check backup_sha256  backup.sh
          # The restic pins are signed too, and lib/config.sh is the single
          # source of truth for them. A channel that disagrees with it means an
          # online box fetches one restic while an install.sh box fetches
          # another — and only one of the two hashes was ever signed.
          cfg() { sed -n "s/^$1=\"\\\${$1:-\\([^}]*\\)}\"/\\1/p" lib/config.sh | head -1; }
          for pair in "restic_version:RESTIC_VERSION" \
                      "restic_sha256_arm64:RESTIC_SHA256_ARM64" \
                      "restic_sha256_amd64:RESTIC_SHA256_AMD64"; do
            field="${pair%%:*}"; var="${pair##*:}"
            want="$(cfg "$var")"
            got="$(sed -n "s/.*\"$field\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p" channel.json | head -1)"
            if [[ "$got" != "$want" ]]; then
              echo "::error::$field is '$got' but lib/config.sh says '$want' — re-run tools/sign-channel.sh"
              rc=1
            else
              echo "$field matches lib/config.sh ($got)"
            fi
          done
          exit $rc

      - name: channel.json.sig verifies
        env:
          PACKAGE_PUBLIC_KEY_PEM: ${{ vars.PACKAGE_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          if [[ -z "${PACKAGE_PUBLIC_KEY_PEM:-}" ]]; then
            echo "::warning::PACKAGE_PUBLIC_KEY_PEM variable not set — signature not verified."
            echo "::warning::Set it so a stale signature cannot reach the fleet."
            exit 0
          fi
          if [[ ! -f channel.json.sig ]]; then
            echo "::error::channel.json.sig is missing. Appliances holding the key will refuse this channel."
            exit 1
          fi
          printf '%s\n' "$PACKAGE_PUBLIC_KEY_PEM" > /tmp/package.pub
          if ! openssl pkeyutl -verify -rawin -pubin -inkey /tmp/package.pub \
                 -sigfile channel.json.sig -in channel.json >/dev/null 2>&1; then
            echo "::error::channel.json.sig does NOT verify against channel.json."
            echo "::error::Every appliance with the key would refuse this channel. Re-sign before merging."
            exit 1
          fi
          echo "signature verifies"

      - name: verifier self-test
        run: tools/test-package-verify.sh
