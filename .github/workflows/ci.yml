name: CI

# Lint every shell script and run the offline-package verifier self-test on each
# push / PR. The signed-channel machinery is only as trustworthy as the code
# that verifies it, so that code is exercised here rather than by hand.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint shell scripts
        run: |
          set -euo pipefail
          shellcheck --version
          mapfile -t files < <(git ls-files '*.sh')
          printf 'linting %d files:\n' "${#files[@]}"; printf '  %s\n' "${files[@]}"
          shellcheck -S warning "${files[@]}"

  package-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline package verifier self-test
        run: ./tools/test-package-verify.sh
