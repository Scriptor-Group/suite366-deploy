name: Offline update package

# Builds the signed USB update package for air-gapped appliances and publishes
# it as a GitHub Release. Manual by design: a package is cut for a specific
# customer visit, not on every push.
#
# Runs on a NATIVE arm64 runner — the appliance is a GB10 (aarch64), and pulling
# arm64 images through qemu on x86 is slow and needlessly fragile when GitHub
# hands out arm64 runners for public repositories.
#
# ⚠️ Disk: the eleven images the chart renders are ~3.8 GiB compressed and
# roughly twice that once `docker save` writes them out uncompressed — so the
# build passes --prune-images, which drops each image from the daemon as soon as
# its tar exists. The vLLM image (~10 GB on its own) still does not fit, so
# `include_vllm` defaults to false. When a release actually changes the vLLM
# image, build the package on a machine with room — typically the same box that
# will write the USB drive:
#   PACKAGE_PRIVATE_KEY=… tools/build-offline-package.sh --arch arm64
#
# No `${{ }}` inside a `run:` block: GitHub substitutes those textually before
# bash parses the line, so quoting does not contain them — and these steps have
# an Ed25519 private key on disk. Inputs reach bash through `env:` only.
on:
  workflow_dispatch:
    inputs:
      min_from:
        description: 'Refuse to apply on appliances older than this app version (blank = no floor)'
        required: false
        default: ''
      include_vllm:
        description: 'Bundle the vLLM image (~10 GB — usually exceeds the runner disk)'
        type: boolean
        required: false
        default: false
      arch:
        description: 'Image platform'
        type: choice
        options: [arm64, amd64]
        default: arm64
      publish_release:
        description: 'Publish the package as a GitHub Release (it is always uploaded as a run artifact)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: write   # create the release and upload its assets
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Read target versions from channel.json
        id: channel
        run: |
          set -euo pipefail
          get() { sed -n "s/.*\"$1\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\".*/\1/p" channel.json | head -1; }
          {
            echo "app_version=$(get app_version)"
            echo "chart_version=$(get chart_version)"
            echo "vllm_image=$(get vllm_image)"
          } >> "$GITHUB_OUTPUT"
          printf 'Building the package for app %s / chart %s\n' "$(get app_version)" "$(get chart_version)"

      - name: Install the signing key
        env:
          # Ed25519 private key (PEM), generated by tools/gen-package-key.sh.
          # Its public half lives on every appliance as package-release.pub.
          PACKAGE_PRIVATE_KEY_PEM: ${{ secrets.PACKAGE_PRIVATE_KEY_PEM }}
        run: |
          [[ -n "$PACKAGE_PRIVATE_KEY_PEM" ]] || {
            echo "::error::secret PACKAGE_PRIVATE_KEY_PEM is not set"; exit 1; }
          install -m 0700 -d "$RUNNER_TEMP/keys"
          printf '%s\n' "$PACKAGE_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/keys/package.key"
          chmod 0600 "$RUNNER_TEMP/keys/package.key"
          # Derive the public half NOW, while the private key is on disk: the
          # verification step below must not need the secret again (interpolating
          # it into a later `run:` block would print it under any shell trace).
          openssl pkey -in "$RUNNER_TEMP/keys/package.key" -pubout \
            -out "$RUNNER_TEMP/package.pub"

      - name: Build + sign the package
        env:
          IN_ARCH: ${{ inputs.arch }}
          IN_MIN_FROM: ${{ inputs.min_from }}
          IN_INCLUDE_VLLM: ${{ inputs.include_vllm }}
        run: |
          set -euo pipefail
          args=( --arch "$IN_ARCH" --out "$RUNNER_TEMP/dist" --prune-images )
          [[ -n "$IN_MIN_FROM" ]] && args+=( --min-from "$IN_MIN_FROM" )
          [[ "$IN_INCLUDE_VLLM" == 'true' ]] || args+=( --no-vllm )
          PACKAGE_PRIVATE_KEY="$RUNNER_TEMP/keys/package.key" \
            tools/build-offline-package.sh "${args[@]}"
          df -h /

      - name: Drop the signing key
        if: always()
        run: shred -u "$RUNNER_TEMP/keys/package.key" 2>/dev/null || true

      - name: Verify the package as an appliance would
        env:
          APP_VERSION: ${{ steps.channel.outputs.app_version }}
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/dist/suite366-update-$APP_VERSION"
          openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/package.pub" \
            -sigfile "$pkg/SHA256SUMS.sig" -in "$pkg/SHA256SUMS"
          ( cd "$pkg" && sha256sum -c --strict --quiet SHA256SUMS )
          echo "package verifies; size: $(du -sh "$pkg" | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: suite366-update-${{ steps.channel.outputs.app_version }}-${{ inputs.arch }}
          path: ${{ runner.temp }}/dist/
          retention-days: 30
          # Already-compressed image layers: recompressing costs minutes and
          # saves nothing.
          compression-level: 0

      - name: Pack the release assets
        if: ${{ inputs.publish_release }}
        id: assets
        env:
          APP_VERSION: ${{ steps.channel.outputs.app_version }}
          IN_ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          # The images are out of the daemon and into tars by now; the store is
          # dead weight and the tarball below needs the room.
          docker system prune -af >/dev/null 2>&1 || true
          df -h /

          pkg="suite366-update-$APP_VERSION"
          base="$pkg-$IN_ARCH"
          install -d "$RUNNER_TEMP/assets"
          tar -czf "$RUNNER_TEMP/$base.tar.gz" -C "$RUNNER_TEMP/dist" "$pkg"

          # A release asset cannot exceed 2 GiB. Split at 1.9 GiB so the parts
          # concatenate back to a byte-identical tarball — the sha256 beside
          # them is what proves it did.
          sha256sum "$RUNNER_TEMP/$base.tar.gz" | sed "s| .*| $base.tar.gz|" \
            > "$RUNNER_TEMP/assets/$base.tar.gz.sha256"
          size="$(stat -c %s "$RUNNER_TEMP/$base.tar.gz")"
          if (( size > 1900 * 1024 * 1024 )); then
            split -b 1900m -d -a 2 "$RUNNER_TEMP/$base.tar.gz" \
              "$RUNNER_TEMP/assets/$base.tar.gz.part"
            rm -f "$RUNNER_TEMP/$base.tar.gz"
            echo "split=1" >> "$GITHUB_OUTPUT"
          else
            mv "$RUNNER_TEMP/$base.tar.gz" "$RUNNER_TEMP/assets/"
            echo "split=0" >> "$GITHUB_OUTPUT"
          fi

          # The three small files that let anyone check what was signed without
          # downloading gigabytes first.
          cp "$RUNNER_TEMP/dist/$pkg/manifest.json" \
             "$RUNNER_TEMP/dist/$pkg/SHA256SUMS" \
             "$RUNNER_TEMP/dist/$pkg/SHA256SUMS.sig" "$RUNNER_TEMP/assets/"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          ls -lh "$RUNNER_TEMP/assets"

      - name: Publish the release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.channel.outputs.app_version }}
          CHART_VERSION: ${{ steps.channel.outputs.chart_version }}
          VLLM_IMAGE: ${{ steps.channel.outputs.vllm_image }}
          IN_ARCH: ${{ inputs.arch }}
          IN_MIN_FROM: ${{ inputs.min_from }}
          IN_INCLUDE_VLLM: ${{ inputs.include_vllm }}
          BASE: ${{ steps.assets.outputs.base }}
          SPLIT: ${{ steps.assets.outputs.split }}
          RELEASE_TAG: pkg/${{ steps.channel.outputs.app_version }}-${{ inputs.arch }}
        run: |
          set -euo pipefail
          vllm="not bundled (the box keeps the image it runs)"
          [[ "$IN_INCLUDE_VLLM" == 'true' ]] && vllm="$VLLM_IMAGE"
          # Built with printf, not a multi-line literal: every line of a `run:`
          # block has to stay inside the YAML block scalar.
          if [[ "$SPLIT" == 1 ]]; then
            reassemble="$(printf '%s\n' \
              "cat $BASE.tar.gz.part* > $BASE.tar.gz" \
              "sha256sum -c $BASE.tar.gz.sha256" \
              "tar xzf $BASE.tar.gz")"
          else
            reassemble="$(printf '%s\n' \
              "sha256sum -c $BASE.tar.gz.sha256" \
              "tar xzf $BASE.tar.gz")"
          fi
          notes="$(printf '%s\n' \
            "Signed offline update package for an air-gapped appliance." \
            "" \
            "| | |" \
            "|---|---|" \
            "| app | \`$APP_VERSION\` |" \
            "| chart | \`$CHART_VERSION\` |" \
            "| platform | \`linux/$IN_ARCH\` |" \
            "| min_from | \`${IN_MIN_FROM:-none}\` |" \
            "| vLLM image | $vllm |" \
            "" \
            "Reassemble, check and unpack — a release asset cannot exceed 2 GiB, so the" \
            "tarball travels in 1.9 GiB parts:" \
            "" \
            '```bash' \
            "$reassemble" \
            "sudo /opt/suite366/update.sh scan-usb \"\$PWD/suite366-update-$APP_VERSION\"" \
            '```' \
            "" \
            "\`scan-usb\` verifies \`SHA256SUMS.sig\` against the appliance's own" \
            "\`package-release.pub\` and applies nothing on its own — it stages the package" \
            "and surfaces the usual update prompt in the admin UI. A box with no key" \
            "installed refuses every package, which is the intended fail-closed default." \
            "" \
            "\`manifest.json\`, \`SHA256SUMS\` and \`SHA256SUMS.sig\` are attached separately so" \
            "the signature can be checked before downloading gigabytes." \
            "" \
            "Built by \`.github/workflows/offline-package.yml\`, run $GITHUB_RUN_ID.")"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::warning::release $RELEASE_TAG already exists — replacing its assets."
            gh release edit "$RELEASE_TAG" --notes "$notes"
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/assets/* --clobber
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/assets/* \
              --title "Offline package $APP_VERSION ($IN_ARCH)" \
              --notes "$notes"
          fi
          {
            echo "### Offline package published"
            echo
            echo "- tag \`$RELEASE_TAG\` — app \`$APP_VERSION\`, chart \`$CHART_VERSION\`, \`linux/$IN_ARCH\`"
            gh release view "$RELEASE_TAG" --json url --jq '"- " + .url' || true
          } >> "$GITHUB_STEP_SUMMARY"
