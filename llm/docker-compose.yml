# Two vLLM instances + a tiny nginx proxy on the DGX Spark's Blackwell GPU
# (GB10, sm_121). The proxy presents a SINGLE OpenAI-compatible endpoint
# (port ${PROXY_PORT}) and routes by URL path:
#   • /v1/embeddings  -> vllm-embed (Qwen3-VL-Embedding-8B)
#   • everything else -> vllm-llm   (Qwen3.8-27B, chat + vision + tools)
# This matches the Suite 366 PR #325 env contract (single VLLM_BASE_URL,
# role-specific VLLM_MODEL_*). The Suite 366 chart is wired automatically via
# values-dgx-spark.yaml.
#
# ⚠️ UNIFIED memory: the GB10 shares a single pool (~121 GiB) between CPU, GPU,
# OS, container runtime, model weights, and KV cache. BOTH vLLM instances pull
# from this same pool -> we explicitly bound each one via
# --gpu-memory-utilization (sum < 1.0, headroom kept for OS/runtime/KV).
#
# Measurements on Spark (nvidia/Qwen3.8-27B-NVFP4, vllm/vllm-openai:v0.29.0,
# 2026-09-17 — the vLLM recipe marks this exact checkpoint "verified" on
# dgx_spark_gb10, and the flags below are that recipe's GB10 profile):
#   • Kernels: NATIVE W4A4 NVFP4 (FlashInferCutlassNvFp4LinearKernel), FP8
#     FlashInfer for the attention projections, FLASHINFER attention (sm121),
#     CUDA Gated-DeltaNet decode kernel. No more Marlin weight-only fallback.
#   • gpu_memory_utilization=0.45 -> weights 20.8 GiB, KV cache = 818,650
#     tokens (fp8) = 3.1× a full 262,144-token request.
#   • Decode is memory-bandwidth bound: 12 t/s bare (20.8 GiB / 273 GB/s),
#     19-20 t/s on French prose and ~30 t/s on code with the in-checkpoint MTP
#     head (3 speculative tokens; 5 measured identical).
#   • Prefill: 2k -> 0.85 s, 16k -> 8.2 s, 69k -> 49 s (~1,400 t/s). Linear
#     attention on 48/64 layers keeps long contexts from going quadratic.
#   • Cold start 257 s (download excluded); warm restart 96 s thanks to the
#     three persisted caches below (torch.compile 28 s and FlashInfer
#     autotune 82 s are skipped when their cache hits).
#
# Values (${...}) are read from the `.env` file generated by install.sh.
# Launched by the systemd unit `suite366-vllm.service`.
services:
  vllm-llm:
    image: ${VLLM_IMAGE}
    container_name: suite366-vllm-llm
    restart: unless-stopped
    # `gpus: all` (compose v2.3+): the modern equivalent of `--gpus all`. More
    # portable than `runtime: nvidia`, which requires `nvidia-ctk runtime
    # configure` (the installer runs it, but this path also works without).
    gpus: all
    ipc: host
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
      VLLM_API_KEY: ${VLLM_API_KEY}
      VLLM_NO_USAGE_STATS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - ${MODELS_DIR}:/root/.cache/huggingface
      # Persisted JIT state. Without these three mounts every `compose up`
      # after an image pull or a `down` re-does torch.compile (~28 s), the
      # FlashInfer autotune sweep (~82 s, sm_121a-specific) and the Triton
      # kernel builds — measured: 257 s cold vs 96 s warm on the same box.
      - ${CACHE_DIR}/vllm:/root/.cache/vllm
      - ${CACHE_DIR}/flashinfer:/root/.cache/flashinfer
      - ${CACHE_DIR}/triton:/root/.triton
    # Bind on the STABLE internal IP (BIND_IP=SUITE_IP), reachable by k3s pods
    # via the node's IP and independent of the LAN. Not exposed on the LAN by
    # design; debug from the host with `curl http://$BIND_IP:$LLM_PORT`.
    ports:
      - "${BIND_IP}:${LLM_PORT}:8000"
    command:
      # Positional model tag (the `--model` form is deprecated by `vllm serve`).
      # No --trust-remote-code: config.json carries no auto_map, vLLM's own
      # Qwen3_5ForConditionalGeneration handler loads it. No --quantization:
      # the ModelOpt mixed NVFP4/FP8 recipe is read from hf_quant_config.json.
      - ${LLM_MODEL}
      - --served-model-name=${LLM_MODEL}
      # fp8 KV halves the cache footprint; the NVIDIA card serves this
      # checkpoint with fp8_e4m3 KV and the recipe's GB10 profile does too.
      - --kv-cache-dtype=fp8
      # Memory budget within the shared unified pool (see header).
      - --gpu-memory-utilization=${LLM_GPU_MEM_UTIL}
      - --max-model-len=${LLM_MAX_MODEL_LEN}
      # GB10 has very limited prefill compute; 2 concurrent large-context
      # requests remain the sane ceiling (recipe: 8 for a standalone Spark).
      - --max-num-seqs=${LLM_MAX_NUM_SEQS}
      # Chunk size for chunked prefill: 8192 (recipe) — bigger chunks would
      # starve the decode of a concurrent request on this compute budget.
      - --max-num-batched-tokens=8192
      - --enable-chunked-prefill
      # Critical for conversational agents (stable system prompt). Hybrid
      # model: vLLM switches its mamba cache to 'align' mode, block size 1616.
      - --enable-prefix-caching
      - --async-scheduling
      # fastsafetensors: weights land in 12 s instead of 114 s with the
      # default loader (no GDS device on Spark -> its nogds copier, still 9×).
      - --load-format=fastsafetensors
      # Qwen3.8 opens every assistant turn with <think>: without the parser the
      # reasoning lands in message.content. Thinking is OFF by default (same
      # effective behaviour as the Gemma 4 template before it); a client can
      # still turn it on per request with chat_template_kwargs.enable_thinking
      # and pick reasoning_effort=low|medium|xhigh.
      - --reasoning-parser=qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_xml
      - '--default-chat-template-kwargs={"enable_thinking": false}'
      # In-checkpoint MTP draft head: the only lever on a bandwidth-bound
      # dense 27B (12 -> 19-30 t/s measured). Acceptance is visible in
      # /metrics as vllm:spec_decode_num_{accepted,draft}_tokens_total.
      - '--speculative-config={"method":"mtp","num_speculative_tokens":3}'
      # The app never sends video; not reserving encoder budget for it.
      - --limit-mm-per-prompt.video=0
      - --host=0.0.0.0
      - --port=8000
    healthcheck:
      # The vllm/vllm-openai image does not ship wget; curl is present.
      test: ["CMD", "sh", "-c", "curl -fsS -m 3 http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 40
      start_period: 600s

  vllm-embed:
    image: ${VLLM_IMAGE}
    container_name: suite366-vllm-embed
    restart: unless-stopped
    gpus: all
    ipc: host
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
      VLLM_API_KEY: ${VLLM_API_KEY}
      VLLM_NO_USAGE_STATS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      # Qwen3-VL: no URL fetching at boot (the model can take images as input;
      # we disable redirects for security).
      VLLM_MEDIA_URL_ALLOW_REDIRECTS: "0"
    volumes:
      - ${MODELS_DIR}:/root/.cache/huggingface
      - ${CACHE_DIR}/vllm:/root/.cache/vllm
      - ${CACHE_DIR}/flashinfer:/root/.cache/flashinfer
      - ${CACHE_DIR}/triton:/root/.triton
    ports:
      - "${BIND_IP}:${EMBED_PORT}:8000"
    command:
      - ${EMBED_MODEL}
      - --served-model-name=${EMBED_MODEL}
      - --trust-remote-code
      # Qwen3-VL-Embedding-8B loads in pooling mode (sentence-transformer).
      # `--task=embed` is deprecated, use --runner=pooling.
      - --runner=pooling
      - --dtype=bfloat16
      - --tensor-parallel-size=1
      # With the explicit KV budget below, this fraction only has to clear
      # vLLM's start-up check (free memory >= fraction × total): 0.20 = 24 GiB,
      # comfortably above the ~20 GiB the container really uses.
      - --gpu-memory-utilization=${EMBED_GPU_MEM_UTIL}
      # 8k is plenty for RAG chunks; 32k just burns more KV without benefit.
      - --max-model-len=${EMBED_MAX_MODEL_LEN}
      # Explicit KV budget. With the fraction alone vLLM turned the whole 0.30
      # share into KV cache: 18.75 GiB = 136k tokens = 16 concurrent 8k requests,
      # for a workload that embeds chunks of a few hundred tokens. 4 GiB is ~29k
      # tokens in flight (3.5 full 8k requests); measured, the container drops
      # from ~36 GiB to ~20 GiB and the box gains 16 GiB of headroom.
      - --kv-cache-memory-bytes=4294967296
      # Same loader win as the LLM: 15.5 GiB of BF16 in 6 s instead of 72.
      - --load-format=fastsafetensors
      - --limit-mm-per-prompt.image=4
      - --limit-mm-per-prompt.video=0
      - --host=0.0.0.0
      - --port=8000
    # Boot after the LLM: otherwise both services reserve their slice of the
    # unified pool at the same time and the second one can be OOM-killed by
    # vLLM.
    depends_on:
      vllm-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS -m 3 http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 40
      start_period: 600s

  # Tiny URL-path proxy: single OpenAI-compatible entry point routing to the
  # two vLLM instances by URL path (/v1/embeddings -> vllm-embed, everything
  # else -> vllm-llm). Suite 366 (PR #325) reads VLLM_BASE_URL = this proxy
  # and selects a model per role via VLLM_MODEL_HIGH/_VISION/_EMBEDDING.
  vllm-proxy:
    image: ${PROXY_IMAGE}
    container_name: suite366-vllm-proxy
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${BIND_IP}:${PROXY_PORT}:8000"
    depends_on:
      vllm-llm:
        condition: service_healthy
      vllm-embed:
        condition: service_healthy
    healthcheck:
      # nginx:alpine ships wget (busybox); /health is served by our own conf.
      # Use 127.0.0.1 (not localhost): busybox wget resolves localhost to ::1
      # first, but nginx only listens on IPv4 0.0.0.0:8000 -> "connection refused".
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
