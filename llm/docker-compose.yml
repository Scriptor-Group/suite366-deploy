# Two vLLM instances (three with transcription) + a tiny nginx proxy on the DGX
# Spark's Blackwell GPU (GB10, sm_121). The proxy presents a SINGLE
# OpenAI-compatible endpoint (port ${PROXY_PORT}) and routes by URL path:
#   • /v1/embeddings  -> vllm-embed (Qwen3-VL-Embedding-8B)
#   • /v1/audio/*     -> vllm-stt   (Qwen3-ASR-1.7B, only for the profiles that
#                                    leave room for it — a compose profile)
#   • everything else -> vllm-llm   (the selected LLM profile, chat + vision + tools)
# This matches the Suite 366 PR #325 env contract (single VLLM_BASE_URL,
# role-specific VLLM_MODEL_*). The Suite 366 chart is wired automatically via
# values-dgx-spark.yaml.
#
# ⚠️ UNIFIED memory: the GB10 shares a single pool (~121 GiB) between CPU, GPU,
# OS, container runtime, model weights, and KV cache. BOTH vLLM instances pull
# from this same pool -> we explicitly bound each one via
# --gpu-memory-utilization (sum < 1.0, headroom kept for OS/runtime/KV).
#
# THIS FILE IS PROFILE-AGNOSTIC. The generative container serves whichever of
# the three models `LLM_PROFILE` names, and switching does not touch it:
#   llm/profiles.sh  (host)      model id, image, memory budgets, context window
#   llm/serve-llm.sh (container) the vLLM flags and env each model needs
#   switch-model.sh  (operator)  rewrites .env, the chart values and the database
# Measured numbers per profile live in those two files and in the README.
#
# Values (${...}) are read from the `.env` file generated by install.sh.
# Launched by the systemd unit `suite366-vllm.service`.
services:
  vllm-llm:
    # Built on the box by lib/vllm.sh: official ${VLLM_IMAGE} + ./flash-next/.
    image: ${VLLM_LLM_IMAGE}
    container_name: suite366-vllm-llm
    restart: unless-stopped
    # `gpus: all` (compose v2.3+): the modern equivalent of `--gpus all`. More
    # portable than `runtime: nvidia`, which requires `nvidia-ctk runtime
    # configure` (the installer runs it, but this path also works without).
    gpus: all
    ipc: host
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
      VLLM_API_KEY: ${VLLM_API_KEY}
      VLLM_NO_USAGE_STATS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      # What serve-llm.sh turns into vllm flags. LLM_PROFILE picks the recipe;
      # the rest are its budgets, written by lib/vllm.sh or switch-model.sh.
      LLM_PROFILE: ${LLM_PROFILE}
      LLM_MODEL: ${LLM_MODEL}
      LLM_MAX_MODEL_LEN: ${LLM_MAX_MODEL_LEN}
      LLM_MAX_NUM_SEQS: ${LLM_MAX_NUM_SEQS}
      LLM_GPU_MEM_UTIL: ${LLM_GPU_MEM_UTIL}
      # In-checkpoint MTP draft head, where the profile has one (12 -> 27-35 t/s
      # on Flash-Next, 12 -> 19-30 on the 27B). Empty for Gemma, which has none.
      LLM_MTP_TOKENS: ${LLM_MTP_TOKENS}
    volumes:
      - ${MODELS_DIR}:/root/.cache/huggingface
      # Persisted JIT state (torch.compile artifacts, FlashInfer cubins, Triton
      # kernels): a restart skips ~30 s of compilation. The 9 min of weight
      # loading cannot be cached.
      - ${CACHE_DIR}/vllm:/root/.cache/vllm
      - ${CACHE_DIR}/flashinfer:/root/.cache/flashinfer
      - ${CACHE_DIR}/triton:/root/.triton
      - ./serve-llm.sh:/app/serve-llm.sh:ro
      # Mounted for every profile, used by one: --tool-call-parser=gemma4 needs
      # it and crashes at boot without. A file is cheaper than a conditional.
      - ./tool_chat_template_gemma4.jinja:/app/tool_chat_template_gemma4.jinja:ro
    # Bind on the STABLE internal IP (BIND_IP=SUITE_IP), reachable by k3s pods
    # via the node's IP and independent of the LAN. Not exposed on the LAN by
    # design; debug from the host with `curl http://$BIND_IP:$LLM_PORT`.
    ports:
      - "${BIND_IP}:${LLM_PORT}:8000"
    # The entrypoint dispatches on LLM_PROFILE and execs `vllm serve` with that
    # model's measured flag set. For Flash-Next it also downloads the checkpoint
    # if needed and resolves its snapshot directory (the mmap patch refuses an
    # HF id). Read it before changing anything here.
    entrypoint: ["/bin/bash", "/app/serve-llm.sh"]
    healthcheck:
      # The vllm/vllm-openai image does not ship wget; curl is present.
      test: ["CMD", "sh", "-c", "curl -fsS -m 3 http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 60
      # Sized for the slowest profile: Flash-Next's first boot is a ~133 GB
      # download (25 min at 85 MB/s) plus 10 min of loading. The other two are
      # up in 2-5 min; start_period only delays the unhealthy verdict, and
      # `depends_on: service_healthy` waits for healthy, not for it to elapse.
      start_period: 2400s

  vllm-embed:
    image: ${VLLM_IMAGE}
    container_name: suite366-vllm-embed
    restart: unless-stopped
    gpus: all
    ipc: host
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
      VLLM_API_KEY: ${VLLM_API_KEY}
      VLLM_NO_USAGE_STATS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      # Qwen3-VL: no URL fetching at boot (the model can take images as input;
      # we disable redirects for security).
      VLLM_MEDIA_URL_ALLOW_REDIRECTS: "0"
    volumes:
      - ${MODELS_DIR}:/root/.cache/huggingface
      - ${CACHE_DIR}/vllm:/root/.cache/vllm
      - ${CACHE_DIR}/flashinfer:/root/.cache/flashinfer
      - ${CACHE_DIR}/triton:/root/.triton
    ports:
      - "${BIND_IP}:${EMBED_PORT}:8000"
    command:
      - ${EMBED_MODEL}
      - --served-model-name=${EMBED_MODEL}
      - --trust-remote-code
      # Qwen3-VL-Embedding-8B loads in pooling mode (sentence-transformer).
      # `--task=embed` is deprecated, use --runner=pooling.
      - --runner=pooling
      - --dtype=bfloat16
      - --tensor-parallel-size=1
      # With the explicit KV budget below, this fraction only has to clear
      # vLLM's start-up check (free memory >= fraction × total): 0.20 = 24 GiB,
      # comfortably above the ~20 GiB the container really uses.
      - --gpu-memory-utilization=${EMBED_GPU_MEM_UTIL}
      # 8k is plenty for RAG chunks; 32k just burns more KV without benefit.
      - --max-model-len=${EMBED_MAX_MODEL_LEN}
      # Explicit KV budget. With the fraction alone vLLM turned the whole 0.30
      # share into KV cache: 18.75 GiB = 136k tokens = 16 concurrent 8k requests,
      # for a workload that embeds chunks of a few hundred tokens. 4 GiB is ~29k
      # tokens in flight (3.5 full 8k requests); measured, the container drops
      # from ~36 GiB to ~20 GiB and the box gains 16 GiB of headroom.
      - --kv-cache-memory-bytes=4294967296
      # Same loader win as the LLM: 15.5 GiB of BF16 in 6 s instead of 72.
      - --load-format=fastsafetensors
      - --limit-mm-per-prompt.image=4
      - --limit-mm-per-prompt.video=0
      - --host=0.0.0.0
      - --port=8000
    # Boot after the LLM: otherwise both services reserve their slice of the
    # unified pool at the same time and the second one can be OOM-killed by
    # vLLM.
    depends_on:
      vllm-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS -m 3 http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 40
      start_period: 600s

  # Transcription (speech-to-text): a third vLLM serving Qwen3-ASR-1.7B on
  # /v1/audio/transcriptions, for the model profiles that leave the memory for
  # it (llm/profiles.sh LLM_P_STT_MODEL). Behind a COMPOSE PROFILE: the service
  # exists only when .env says COMPOSE_PROFILES=stt, which lib/vllm.sh and
  # switch-model.sh write from the model profile. `docker compose up -d` (the
  # systemd unit) then starts it or ignores it, and the nginx route to it
  # resolves lazily, so its absence costs nothing and breaks nothing.
  vllm-stt:
    profiles: ["stt"]
    # Built on the box by lib/vllm.sh: ${VLLM_IMAGE} + ./stt/ (the audio
    # extras the arm64 image ships without — see llm/stt/Dockerfile).
    # The `:-` defaults below exist for ONE reason: a box whose .env predates
    # transcription. Compose warns on every unset variable at each boot and
    # refuses `--profile stt` outright without an image; the service is off on
    # such a box anyway. llm/profiles.sh is the authority for the values —
    # lib/vllm.sh and switch-model.sh write all of them into .env.
    image: ${VLLM_STT_IMAGE:-suite366/vllm-stt:unset}
    container_name: suite366-vllm-stt
    restart: unless-stopped
    gpus: all
    ipc: host
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
      VLLM_API_KEY: ${VLLM_API_KEY}
      VLLM_NO_USAGE_STATS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - ${MODELS_DIR}:/root/.cache/huggingface
      - ${CACHE_DIR}/vllm:/root/.cache/vllm
      - ${CACHE_DIR}/flashinfer:/root/.cache/flashinfer
      - ${CACHE_DIR}/triton:/root/.triton
    ports:
      - "${BIND_IP}:${STT_PORT:-8003}:8000"
    command:
      - ${STT_MODEL:-Qwen/Qwen3-ASR-1.7B}
      - --served-model-name=${STT_MODEL:-Qwen/Qwen3-ASR-1.7B}
      - --dtype=bfloat16
      # Same pattern as the embed: an explicit KV budget, and a fraction that
      # only has to clear vLLM's start-up free-memory check. The numbers and
      # their reasoning live in llm/profiles.sh (LLM_STT_*).
      - --gpu-memory-utilization=${STT_GPU_MEM_UTIL:-0.10}
      - --kv-cache-memory-bytes=${STT_KV_CACHE_BYTES:-2147483648}
      - --max-model-len=${STT_MAX_MODEL_LEN:-8192}
      - --max-num-seqs=${STT_MAX_NUM_SEQS:-8}
      - --load-format=fastsafetensors
      - --host=0.0.0.0
      - --port=8000
    # After the LLM, for the same reason as the embed: one slice of the unified
    # pool at a time.
    depends_on:
      vllm-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS -m 3 http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 40
      # First boot downloads the 4.4 GB checkpoint (~1 min at 85 MB/s) and
      # compiles; a warm restart is well under a minute.
      start_period: 1200s

  # Tiny URL-path proxy: single OpenAI-compatible entry point routing to the
  # vLLM instances by URL path (/v1/embeddings -> vllm-embed, /v1/audio/* ->
  # vllm-stt, everything else -> vllm-llm). Suite 366 (PR #325) reads VLLM_BASE_URL = this proxy
  # and selects a model per role via VLLM_MODEL_HIGH/_VISION/_EMBEDDING.
  vllm-proxy:
    image: ${PROXY_IMAGE}
    container_name: suite366-vllm-proxy
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${BIND_IP}:${PROXY_PORT}:8000"
    depends_on:
      vllm-llm:
        condition: service_healthy
      vllm-embed:
        condition: service_healthy
    healthcheck:
      # nginx:alpine ships wget (busybox); /health is served by our own conf.
      # Use 127.0.0.1 (not localhost): busybox wget resolves localhost to ::1
      # first, but nginx only listens on IPv4 0.0.0.0:8000 -> "connection refused".
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
