# Tiny URL-path router that unifies the two local vLLM instances behind a
# SINGLE OpenAI-compatible endpoint — matches the Suite 366 PR #325 contract
# (one `VLLM_BASE_URL`, role-specific `VLLM_MODEL_*`).
#
# Routing :
#   /v1/embeddings  -> vllm-embed:8000   (Qwen3-VL-Embedding-8B, pooling)
#   /v1/audio/*     -> vllm-stt:8000     (Qwen3-ASR-1.7B transcription; a
#                                         compose profile, so the service may
#                                         not exist — resolved per request)
#   /v1/models      -> vllm-llm:8000     (chart only uses VLLM_MODEL_*, so we
#                                         expose the chat model list — for
#                                         discovery purposes)
#   /v1/*           -> vllm-llm:8000     (chat completions, completions,
#                                         chat templates, etc. — Gemma 4 is
#                                         multimodal so /v1/chat/completions
#                                         handles vision too)
#   /health         -> answered here      (the compose healthcheck; never
#                                         probes vLLM)
#   anything else   -> 404, answered here. vLLM's API-key middleware guards
#                      /v1/* ONLY: /tokenize, /detokenize, /invocations,
#                      /metrics and /version answer WITHOUT a key. The relay
#                      used to be a catch-all (`location /`), and on the test
#                      box (2026-10-13) every one of those answered through
#                      the proxy to anything that could reach it — every pod
#                      on the box. The app speaks /v1/* and the proxy's own
#                      /health, nothing else; the direct engine ports keep
#                      the rest for debugging from the host.
#
# Service names (vllm-llm, vllm-embed, vllm-stt) resolve via the compose default
# network — at REQUEST time, through Docker's embedded DNS, for all three routes.
# Not `upstream` blocks: nginx resolves those once at start-up and keeps the IP.
# Measured 2026-10-06: after the engines were stopped and started in another
# order, vllm-llm and vllm-embed had swapped addresses on the network, the
# proxy sent chats to the embed (the app saw 404 "Not Found") and embeddings
# to the LLM, and only a restart of the proxy fixed it. A variable in
# proxy_pass is re-resolved every `valid=` seconds instead, and a name that is
# missing (the transcription service behind its compose profile) answers 502
# on its route without taking the others down.

events {}

http {
  # GB10 prefill at 200k+ tokens can take ~10 min; the timeouts must cover it.
  proxy_connect_timeout 30s;
  proxy_send_timeout    1800s;
  proxy_read_timeout    1800s;
  send_timeout          1800s;

  # Vision/OCR pipelines POST screenshots + multi-page PDFs (base64-encoded
  # inside /v1/chat/completions content blocks) to vLLM. Nginx default of
  # 1 MB drops them with 413 — symptom: "RunicEnrich screenshot vision
  # failed page=N: 413" and "FileProcessing OCR FAILED ... error=413" in
  # drive-app logs. vLLM itself enforces per-model limits, so the proxy
  # just needs to not be the chokepoint.
  client_max_body_size 100M;

  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8000;
    server_name _;

    # Liveness for our own healthcheck (Compose). Cheap, doesn't probe vLLM.
    location = /health {
      access_log off;
      return 200 '{"status":"ok"}';
      default_type application/json;
    }

    location = /v1/embeddings {
      set                $embed_upstream http://vllm-embed:8000;
      proxy_pass         $embed_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_buffering    off;     # never buffer; embed responses are small
    }

    # Transcription: the service is behind a compose profile and may not
    # exist; resolved per request like the others, this route answers 502
    # on its own and nothing else notices. The URI is passed through unchanged.
    location /v1/audio/ {
      set                $stt_upstream http://vllm-stt:8000;
      proxy_pass         $stt_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_request_buffering off;   # a 15 MB dictation streams through
      proxy_read_timeout 600s;       # ten 30 s windows of a long upload
    }

    location = /v1/models {
      set                $llm_upstream http://vllm-llm:8000;
      proxy_pass         $llm_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
    }

    # The generative engine: every other /v1/ route, all methods (the exact
    # and longer-prefix locations above win over this prefix).
    location /v1/ {
      set                $llm_upstream http://vllm-llm:8000;
      proxy_pass         $llm_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_buffering          off;   # streaming chat completions
      proxy_request_buffering  off;   # 1MB+ prompts arrive in chunks
    }

    # Everything outside /v1/ stops here, and nothing below is a relay: the
    # key-less vLLM routes (/tokenize, /invocations, /metrics, /version …)
    # are not the proxy's to hand out.
    location / {
      return 404;
    }
  }
}
