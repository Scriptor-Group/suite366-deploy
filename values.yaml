# ============================================================================
# DGX Spark deployment — full Suite 366 in-cluster on single-node k3s.
# Derived from charts/drive/values-client-autonome.yaml.
#
# DGX Spark specifics:
#   • hostnames are NOT hardcoded: install.sh substitutes @APP_HOST@ /
#     @OFFICE_HOST@ / @LIVEKIT_HOST@ / @TURN_HOST@ (defaults drive./office./
#     livekit./turn. under *.suite366.local, resolved via mDNS/Avahi);
#   • TLS from the self-signed local CA (ClusterIssuer "suite366-local-ca") or
#     from customer-provided certificates — see TLS_MODE in lib/config.sh;
#   • images pulled anonymously from ghcr.io/scriptor-group (chart defaults).
#     The packages are public; no imagePullSecrets needed.
#   • sandbox (code-exec) stack enabled — runs in the `@SANDBOX_NAMESPACE@`
#     namespace pre-created (with PSS labels) by install.sh so helm doesn't
#     have to manage the Namespace itself.
#   • generative + embeddings served by vLLM OUTSIDE the cluster (Docker
#     host), unified by an nginx proxy, wired AUTOMATICALLY into the chart
#     via VLLM_* env vars (Suite 366 PR #325 `chooseDefaultModel`).
#
# install.sh substitutes @… tokens before `helm install`.
# ============================================================================
appName: drive-app

# --- Image pinning + offline safety (appliance) ------------------------------
# Every image is pinned to a fixed version tag (NO :latest) for reproducibility
# and offline restarts. global.imagePullPolicy makes k8s reuse the locally
# present image instead of re-pulling (which fails offline). See the pins in the
# redis/postgres/minio/onlyoffice/livekit/sandbox blocks below.
global:
  imagePullPolicy: IfNotPresent

# App + sandbox share the release train; 1.8.22 is the current published version.
# image.repository stays at the chart default (ghcr.io/scriptor-group/suite-366);
# the GHCR packages are public so no imagePullSecrets are needed.
image:
  tag: "1.8.22"

replicas: 1
podAntiAffinity:
  enabled: false
customCA:
  enabled: false

# DB schema applied automatically on first deployment.
migrations:
  enabled: true

# generateSecrets: true (default) -> AUTH_SECRET, CRON_SECRET, POSTGRES_PASSWORD,
# DATABASE_URL, MinIO, ONLYOFFICE_JWT_SECRET, LIVEKIT_* are generated and
# persisted. We add VLLM_API_KEY (shared between vLLM and the app)
# so chooseDefaultModel() can authenticate against the local nginx proxy.
secrets:
  VLLM_API_KEY: "@VLLM_API_KEY@"

config:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  WS_PORT: "3001"
  AUTH_URL: https://@APP_HOST@
  APP_URL: https://@APP_HOST@
  WS_URL: wss://@APP_HOST@
  MINIO_BUCKET: suite-366
  ONLYOFFICE_URL: https://@OFFICE_HOST@
  LIVEKIT_PUBLIC_URL: wss://@LIVEKIT_HOST@
  # --- Local AI (vLLM host) — wired AUTOMATICALLY ---------------------------
  # Suite 366 PR #325 (chooseDefaultModel): when VLLM_BASE_URL is set, the
  # local vLLM is preferred over Anthropic/OpenAI for every role. The base
  # URL points to the nginx proxy on the host, which routes by URL path
  # (/v1/embeddings -> vllm-embed, everything else -> vllm-llm). We target
  # @SUITE_IP@ (the stable internal IP on the dummy interface, reached via the
  # node IP) instead of the LAN IP: pods keep reaching vLLM across DHCP/NIC
  # changes and offline. `.local` mDNS is not usable here — pods don't resolve
  # it (host-side resolution only).
  VLLM_BASE_URL: "http://@SUITE_IP@:@PROXY_PORT@/v1"
  VLLM_MODEL_HIGH: "@LLM_MODEL@"
  VLLM_MODEL_LIGHT: "@LLM_MODEL@"
  VLLM_MODEL_VISION: "@LLM_MODEL@"
  VLLM_MODEL_EMBEDDING: "@EMBED_MODEL@"
  VLLM_EMBEDDING_DIMENSIONS: "@VLLM_EMBEDDING_DIMENSIONS@"
  # Max context window (tokens) the app advertises for the local model, so
  # prompt assembly / truncation sizes correctly. install.sh substitutes
  # @VLLM_MAX_CONTEXT_WINDOW@ (default 200000, override via env var).
  VLLM_MAX_CONTEXT_WINDOW: "@VLLM_MAX_CONTEXT_WINDOW@"
  # --- Licensing -----------------------------------------------------------
  # Ed25519 (EdDSA) PUBLIC key the app uses to VERIFY signed license tokens.
  # Verification-only: it cannot forge or sign licenses, so it is safe to ship
  # with every appliance. The matching PRIVATE key never leaves the issuer
  # (Devana) — see suite-366 serveur/LICENSE-GENERATION.md. install.sh
  # substitutes @LICENSE_PUBLIC_KEY@ (default baked in, override via the
  # LICENSE_PUBLIC_KEY env var). The \n escapes become real PEM newlines once
  # YAML parses this double-quoted scalar. To actually unlock multi-org /
  # paid limits, also set a signed LICENSE_KEY (issued against your org id).
  LICENSE_PUBLIC_KEY: "@LICENSE_PUBLIC_KEY@"
  # SMTP (optional) — fill in if you need outgoing email:
  # SMTP_HOST: smtp.example.com
  # SMTP_PORT: "587"
  # SMTP_FROM: "Suite 366 <noreply@@DOMAIN@>"

ingress:
  enabled: true
  className: traefik
  annotations:
    # One line, substituted by install.sh: either the cert-manager issuer
    # (TLS_MODE=local-ca) or an inert marker annotation (TLS_MODE=provided,
    # where install.sh creates the TLS Secrets itself and cert-manager is not
    # deployed at all). Keeping it a single line keeps the YAML valid in both
    # modes without conditional rendering.
    @INGRESS_CERT_ANNOTATION@
  hosts:
    - host: @APP_HOST@
      paths:
        - path: /socket.io/
          pathType: Prefix
          port: 3001
        # Workbench : proxy bureau (KasmVNC) et Drive WebDAV, servis par le
        # process ws — les Route Handlers Next ne relaient ni PROPFIND/MKCOL/
        # MOVE ni l'upgrade WebSocket.
        - path: /wb-desktop/
          pathType: Prefix
          port: 3001
        - path: /dav/
          pathType: Prefix
          port: 3001
        - path: /
          pathType: Prefix
          port: 80
  tls:
    - secretName: @APP_TLS_SECRET@
      hosts: [@APP_HOST@]

redis:
  enabled: true
  persistence:
    enabled: true
    size: 5Gi
    storageClass: local-path

postgres:
  enabled: true
  database: suite366
  username: suite366
  persistence:
    enabled: true
    size: 10Gi
    storageClass: local-path

minio:
  enabled: true
  image: minio/minio:RELEASE.2025-09-07T16-13-09Z   # pinned (chart default is :latest)
  persistence:
    enabled: true
    size: 50Gi
    storageClass: local-path

onlyoffice:
  enabled: true
  image: onlyoffice/documentserver:9.4.0   # pinned (chart default is :latest)
  persistence:
    enabled: true
    size: 10Gi
    storageClass: local-path
  ingress:
    enabled: true
    className: traefik
    host: @OFFICE_HOST@
    # Empty in TLS_MODE=provided: the chart drops the cert-manager annotation
    # but still renders the tls block, because tlsSecretName is set explicitly.
    clusterIssuer: "@CLUSTER_ISSUER@"
    tlsSecretName: @OFFICE_TLS_SECRET@

# livekit is the ONE workload that needs the CURRENT LAN IP (not the stable
# internal IP): hostNetwork media must be reachable by LAN browsers. With
# rtc.dynamicNodeIp the chart's render-node-ip initContainer detects the LAN IP
# at pod start (no STUN — that returns the WAN IP, wrong for LAN/offline) and
# writes it as rtc.node_ip. The network-change dispatcher hook (lib/mdns.sh)
# does a `rollout restart` so it re-detects when the connection switches.
livekit:
  enabled: true
  hostNetwork: true                        # UDP media on single-node k3s
  image: livekit/livekit-server:v1.13.2    # pinned (chart default is :latest)
  initImage: busybox:1.37                   # for the render-node-ip initContainer
  rtc:
    dynamicNodeIp: true                     # advertise the current LAN IP, no STUN
    useExternalIp: false
  ingress:
    enabled: true
    className: traefik
    host: @LIVEKIT_HOST@
    clusterIssuer: "@CLUSTER_ISSUER@"
    tlsSecretName: @LIVEKIT_TLS_SECRET@
  turn:
    enabled: true
    domain: @TURN_HOST@
    tlsPort: 5349
    tlsSecretName: @TURN_TLS_SECRET@
    # TURN is not HTTP, so cert-manager cannot issue through an Ingress: the
    # chart asks for a Certificate explicitly. In TLS_MODE=provided that whole
    # object is disabled and install.sh writes the Secret instead.
    certManager:
      enabled: @TURN_CERT_MANAGER@
      issuerName: "@CLUSTER_ISSUER@"
      issuerKind: ClusterIssuer

# --- Appliance host <-> app bridges ------------------------------------------
# Two hostPath dirs are shared with the drive-app pod:
#
#  @DATA_DIR@/updates  -> /appliance-update  (APPLIANCE_UPDATE_DIR)
#    update.sh publishes state.json / apply.json there, and the app drops
#    trigger files (check-requested / apply-requested) that systemd .path units
#    pick up to run update.sh — this powers the "update available" banner + the
#    update button in the admin UI.
#
#  @DATA_DIR@/backup   -> /appliance-backup  (APPLIANCE_BACKUP_DIR)
#    backup.sh publishes state.json there (last run, snapshots, destination,
#    key fingerprint) and the app drops run-/test-/configure-requested triggers.
#    The credentials themselves live in backup.env inside that directory at
#    0600, so the pod can ASK for a destination but can never read back the
#    secret it set.
#
#  @DATA_DIR@/support  -> /support-access    (SUPPORT_ACCESS_DIR)
#    Remote-support access toggle, used on RENTED fleet appliances only. The
#    host agent publishes state.json (grant + pre-arm state) and the app drops
#    grant-requested / revoke-requested / prearm-requested. On a customer-run
#    appliance the dir stays empty, state.json never appears, and the app hides
#    the feature entirely — so this single values.yaml serves both products.
#
# Both use the chart's generic extraEnv/extraVolumes (no chart change).
# install.sh creates the dirs root:1001 mode 0770 (the app container runs as
# uid/gid 1001; k8s does not fsGroup-chown hostPath volumes).
extraEnv:
  - name: APPLIANCE_UPDATE_DIR
    value: /appliance-update
  - name: SUPPORT_ACCESS_DIR
    value: /support-access
  - name: APPLIANCE_BACKUP_DIR
    value: /appliance-backup
extraVolumeMounts:
  - name: appliance-update
    mountPath: /appliance-update
  - name: support-access
    mountPath: /support-access
  - name: appliance-backup
    mountPath: /appliance-backup
extraVolumes:
  - name: appliance-update
    hostPath:
      path: @DATA_DIR@/updates
      type: DirectoryOrCreate
  - name: support-access
    hostPath:
      path: @DATA_DIR@/support
      type: DirectoryOrCreate
  - name: appliance-backup
    hostPath:
      path: @DATA_DIR@/backup
      type: DirectoryOrCreate

# Sandbox (code-exec) stack — runs in a dedicated PSS-restricted namespace,
# pre-created by install.sh so the GHCR pull secret lands BEFORE sandbox-api
# / sandbox-runner pods schedule. The chart wires SANDBOX_API_URL into the
# drive-app config automatically and shares SANDBOX_API_KEY (generated) with
# secret-sandbox so the two sides match.
sandbox:
  enabled: true
  namespace: @SANDBOX_NAMESPACE@
  # install.sh creates the namespace + applies PSS labels, so the chart skips
  # its own Namespace template (avoids ownership conflict with our pre-create).
  createNamespace: false
  # Pinned to the current release (chart defaults are :latest). pullPolicy
  # IfNotPresent overrides the chart's Always so runner/api restart offline.
  api:
    image: ghcr.io/scriptor-group/suite-366-sandbox-api:1.8.22
    pullPolicy: IfNotPresent
  runnerImage: ghcr.io/scriptor-group/suite-366-sandbox-runner:1.8.22
  # Tune sessions/limits if the GB10 unified memory budget is tight — defaults
  # aim at 20 pods × 512 MB.

  # Workbench — per-user persistent dev sandbox (terminal + opencode + Firefox
  # desktop, cf. suite-366/documentation/34-workbench.md). One pod + one PVC
  # (local-path) + one NetworkPolicy per workbench, in its own namespace. The
  # chart wires WORKBENCH_ENABLED on both drive-app and sandbox-api sides, and
  # the ingress below routes /wb-desktop/ + /dav/ to the ws port.
  # FUSE (~/drive mount) stays off: it would require privileged pods.
  # NOTE budget GB10 : chaque workbench actif = jusqu'à 4 Gi / 2 cpu.
  workbench:
    enabled: true
    # latest jusqu'au premier release train qui publie l'image ; épingler
    # ensuite comme les images sandbox ci-dessus.
    runnerImage: ghcr.io/scriptor-group/suite-366-workbench-runner:latest
    # IfNotPresent : redémarrage offline (l'image est pré-pullée par install.sh)
    pullPolicy: IfNotPresent
    storageClass: local-path
    resourceQuota:
      # Un seul GB10 : borné plus bas que les défauts du chart.
      pods: "10"
      requestsCpu: "4"
      requestsMemory: "4Gi"
      limitsCpu: "20"
      limitsMemory: "40Gi"
      persistentVolumeClaims: "30"
      requestsStorage: "300Gi"
